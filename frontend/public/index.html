    <!-- Meta Tags for SEO and Social Sharing -->
    <meta name="description"
        content="Sinergi Visual UGC Generator Prompt — Ubah foto produk menjadi prompt video UGC profesional siap pakai untuk AI video generator seperti Google Flow, Sora, Runway, dan Kling." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sinergi Visual UGC Generator Prompt" />
    <meta property="og:title" content="Sinergi Visual UGC Generator Prompt" />

        content="Buat prompt video UGC profesional dari satu foto produk dengan kecerdasan buatan." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Theme & Favicon Initialization to Prevent Flash of Unstyled Theme -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('sinergi_theme') || localStorage.getItem('theme');
                var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                var icon = document.querySelector("link[rel~='icon']");
                if (icon) {
                    icon.href = isDark ? '/favicon.svg' : '/favicon1.svg';
                }
            } catch (e) { }
        })();
    </script>
    <script>window.addEventListener("error", function (e) { if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) { e.stopImmediatePropagation(); e.preventDefault() } }, true);</script>
</head>

<body>

    <div id="root"></div>
</body>

</html>
